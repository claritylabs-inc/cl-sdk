name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release @claritylabs/cl-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install semantic-release (CI-only)
        run: npm install --no-save semantic-release@25 @semantic-release/changelog@6 @semantic-release/git@10

      - name: Build package
        run: npm run build

      - name: Run semantic-release (GitHub release + version bump)
        id: semantic
        run: |
          set +e
          OUTPUT=$(npx semantic-release 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::semantic-release failed"
            exit "$STATUS"
          fi

          if echo "$OUTPUT" | grep -q "Published GitHub release"; then
            NEW_VERSION=$(node -p 'require("./package.json").version')
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Released version: $NEW_VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "No new release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (only after GitHub release succeeds)
        if: steps.semantic.outputs.released == 'true'
        id: npm_publish
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          if npm view "@claritylabs/cl-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published to npm"
            echo "published=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Publishing version $VERSION to npm..."
          npm publish --provenance --access public
          echo "published=true" >> $GITHUB_OUTPUT
          echo "Successfully published to npm"

      - name: Repair npm publish for existing release tag
        if: steps.semantic.outputs.released != 'true'
        id: npm_publish_repair
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if npm view "@claritylabs/cl-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published to npm"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "No release tag v$VERSION exists; skipping repair publish"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Republished release metadata for @claritylabs/cl-sdk@$VERSION after npm publish repair."
          fi

          echo "Repair publishing version $VERSION to npm..."
          npm publish --provenance --access public
          echo "published=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report npm publish failure
        if: failure() && steps.semantic.outputs.released == 'true' && steps.npm_publish.outputs.published != 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          echo "::error::npm publish failed for v$VERSION. Leaving the GitHub release and tag in place so a tombstoned npm version is not retried indefinitely. Push a follow-up fix release after resolving the npm state."

      - name: Verify release consistency
        if: (steps.semantic.outputs.released == 'true' && steps.npm_publish.outputs.published == 'true') || steps.npm_publish_repair.outputs.published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.version || steps.npm_publish_repair.outputs.version }}"
          echo "Verifying release consistency for version $VERSION..."

          gh release view "v$VERSION" --json tagName || exit 1

          NPM_VERIFIED=false
          for i in 1 2 3 4 5 6; do
            if npm view "@claritylabs/cl-sdk@$VERSION" version 2>/dev/null; then
              echo "✓ npm package verified"
              NPM_VERIFIED=true
              break
            fi
            echo "Waiting for npm to propagate... (attempt $i/6)"
            sleep 10
          done

          if [ "$NPM_VERIFIED" != "true" ]; then
            echo "::error::npm package @claritylabs/cl-sdk@$VERSION was not visible after publish"
            exit 1
          fi

          echo "✓ Release consistency verified - GitHub and npm are in sync"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
